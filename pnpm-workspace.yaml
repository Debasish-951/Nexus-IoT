packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # ── Supply-chain remediation ────────────────────────────────────────────────
  #
  # Forces patched versions of TRANSITIVE dependencies whose direct parents have
  # not yet released an update.
  #
  # Consolidated by hand: `pnpm audit --fix` emitted 49 overlapping entries (five
  # separate `dompurify` ranges alone) and contradicted the existing esbuild pin,
  # which would not have installed.
  #
  # EVERY range is bounded to the current major. An unbounded `>=` is not a
  # security fix, it is an unreviewed major upgrade: the first attempt at this
  # file used `vite: '>=7.3.5'` and silently resolved vite 8.2.1, when the
  # advisory only required 7.3.5. Bounding keeps the change to the smallest one
  # that closes the advisory. For 0.x packages the MINOR is the breaking unit,
  # so esbuild is bounded there instead.
  #
  # `nanoid` and `picomatch` exist at several majors in this tree, so each major
  # is floored separately in one compound range rather than crossing majors.
  #
  # Review at each dependency bump: an override that outlives its reason silently
  # holds back a package its parent has since moved past.

  # Pre-existing loader alias, not security related.
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0

  '@babel/core': '>=7.29.6 <8'
  # Nov 2026 audit (DEP-01): floors raised to the patched release in the same major.
  baseline-browser-mapping: '>=2.11.0 <3'
  body-parser: '>=2.4.0 <3'
  brace-expansion: '>=2.1.7 <3'
  browserslist: '>=4.28.7 <5'
  dompurify: '>=3.4.17 <4'
  esbuild: '>=0.28.1 <0.29'
  fast-copy: '>=4.1.0 <5'
  fast-uri: '>=3.1.6 <4'
  fflate: '>=0.8.3 <0.9'
  ip-address: '>=10.7.4 <11'
  js-yaml: '>=4.3.2 <5'
  linkify-it: '>=5.0.2 <6'
  lodash: '>=4.18.0 <5'
  markdown-it: '>=14.3.2 <15'
  # NOTE: there is deliberately NO nanoid override.
  #
  # The vulnerable nanoid came in under postcss 8.5.8. postcss 8.5.23+ already
  # declares `nanoid: ^3.3.17`, so the postcss floor below fixes it transitively
  # and the parent stays in charge of its own dependency.
  #
  # Two attempts at overriding it directly both broke the frontend build with
  # ERR_REQUIRE_ESM: a pnpm override REPLACES the requested spec rather than
  # intersecting it, so forcing nanoid 5 or 6 handed postcss's CommonJS
  # `require()` an ESM-only package. The lesson is worth keeping — prefer raising
  # the PARENT to a version that already depends on a patched child, and reach
  # for an override on the child only when no such parent release exists.
  path-to-regexp: '>=8.4.0 <9'
  picomatch: '>=4.0.4 <5'
  postcss: '>=8.5.23 <9'
  postcss-selector-parser: '>=6.1.5 <7'
  proxy-addr: '>=2.0.8 <3'
  qs: '>=6.16.1 <7'
  source-map-js: '>=1.2.2 <2'
  vite: '>=7.3.7 <8'
  ws: '>=8.21.0 <9'
  yaml: '>=2.8.3 <3'
